<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F4EFE6">
<title>Silk &amp; Shape — Жуки-Ткачи</title>
<style>
:root{color-scheme:light;--paper:#F4EFE6;--ink:#5C4D3C;--muted:#8B7A66;--panel:#FBF8F1;--red:#D9534F;--teal:#2A9D8F;--blue:#477DA8;--gold:#E9C46A}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Georgia,"Times New Roman",serif;touch-action:none}
body{display:grid;place-items:center;background:#e9dfd0}
#game{position:relative;width:min(100vw,56.25vh);height:min(100dvh,177.7778vw);aspect-ratio:9/16;overflow:hidden;background:var(--paper);isolation:isolate;box-shadow:0 18px 70px #57452c24}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;z-index:2;top:max(12px,env(safe-area-inset-top));left:14px;right:14px;display:none;align-items:center;gap:9px}
.pill{background:rgba(255,252,245,.88);border:1px solid #cdbda8;border-radius:14px;padding:9px 12px;box-shadow:0 3px 9px #6b52301a}
#levelLabel{font:700 11px/1.2 system-ui,sans-serif;letter-spacing:.12em;color:#796650;text-transform:uppercase;white-space:nowrap}
#progressWrap{height:6px;background:#dfd4c4;border-radius:8px;margin-top:7px;overflow:hidden;width:100%}
#progress{height:100%;width:0;background:linear-gradient(90deg,#2A9D8F,#D9534F);border-radius:8px;transition:width .12s}
#progressText{font:700 12px system-ui,sans-serif;min-width:36px;text-align:right}
#home{width:42px;height:42px;border-radius:13px;border:1px solid #cdbda8;color:#5C4D3C;background:#fffaf1;font-size:19px}#restart{margin-left:auto;width:42px;height:42px;border-radius:13px;border:1px solid #cdbda8;color:#5C4D3C;background:#fffaf1;font-size:22px;box-shadow:0 3px 9px #6b52301a}
#screen{position:absolute;z-index:3;inset:0;display:flex;align-items:center;justify-content:center;padding:26px;text-align:center;background:rgba(244,239,230,.22)}
.card{width:100%;max-width:350px;padding:32px 24px;border:1px solid #d5c7b5;border-radius:25px;background:rgba(255,252,245,.94);box-shadow:0 18px 55px #6b52302a,inset 0 1px #fff}
.eyebrow{font:700 10px system-ui,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#9b7653;margin-bottom:15px}
h1{font-size:clamp(36px,10vw,53px);line-height:.96;letter-spacing:-.055em;margin:0 0 16px;font-weight:800;color:#5C4D3C}
h1 span{display:block;color:#B86B50}
.subtitle{font:14px/1.55 system-ui,sans-serif;color:#806f5d;margin:0 auto 24px;max-width:285px}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.primary{width:100%;border:0;border-radius:16px;padding:16px 20px;font:800 15px system-ui,sans-serif;letter-spacing:.08em;color:#fffaf1;background:linear-gradient(110deg,#B86B50,#D9534F);box-shadow:0 5px 0 #944a3e,0 9px 20px #9c59402b}
.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #944a3e}
.small{font:12px system-ui,sans-serif;color:#a18e79;margin-top:17px}
#screen.hidden{display:none}#screen.compact{background:rgba(80,62,42,.14)}
#screen.compact .card{max-width:305px;padding:27px 22px}
#screen.compact h1{font-size:32px;margin-bottom:10px}
#screen.compact .subtitle{margin-bottom:19px}
@media(min-height:700px){.card{padding:38px 27px}}
</style>
</head>
<body>
<main id="game" aria-label="Silk and Shape">
<canvas id="canvas"></canvas>
<div id="hud"><div class="pill" style="flex:1"><div id="levelLabel">УРОВЕНЬ 1 · СЕРДЦЕ</div><div id="progressWrap"><div id="progress"></div></div></div><div class="pill" id="progressText">0%</div><button id="home" aria-label="Домой">⌂</button><button id="restart" aria-label="Заново">↻</button></div>
<section id="screen"><div class="card"><div class="eyebrow">Маленькая мастерская чудес</div><h1>SILK <span>&amp; SHAPE</span></h1><p class="subtitle" id="menuProgress">Уровень 1 из 5</p><button class="primary" id="play">ИГРАТЬ</button><button id="settingsOpen" style="margin-top:18px;border:1px solid #d5c7b5;background:#f4efe6;color:#5c4d3c;border-radius:14px;padding:12px 18px;font:700 13px system-ui">⚙ Настройки</button><div class="small">5 уютных узоров · хлопковые нити · живые жучки</div></div></section>
</main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),game=document.getElementById('game');
const hud=document.getElementById('hud'),screen=document.getElementById('screen'),playBtn=document.getElementById('play');
const levelLabel=document.getElementById('levelLabel'),progressBar=document.getElementById('progress'),progressText=document.getElementById('progressText');
const C=['#D9534F','#2A9D8F','#477DA8','#E9C46A'],INK='#5C4D3C',PAPER='#F4EFE6',TAU=Math.PI*2;
let W=0,H=0,D=1,last=0,time=0,scene='start',level=0,audio=null,pegs=[],edges=[],spiders=[],particles=[],grain=[],panelTimer=null;
let soundOn=localStorage.getItem('silkShapeSound')!=='off',savedLevel=Math.max(0,Math.min(4,Number(localStorage.getItem('silkShapeLevel')||0)||0)),demo={bugs:[],fade:0,cycle:0,hold:0},dtDemo=0;
const levels=[
{name:'СЕРДЕЧКО',speed:76,paths:[{c:0,p:[[.50,.67],[.27,.49],[.18,.34],[.20,.23],[.31,.19],[.41,.24],[.50,.34],[.59,.24],[.69,.19],[.80,.23],[.82,.34],[.73,.49]]}]},
{name:'ДОМИК',speed:91,paths:[{c:0,p:[[.25,.60],[.25,.40],[.50,.20],[.75,.40],[.75,.60]]}]},
{name:'КОРАБЛИК',speed:105,paths:[{c:2,p:[[.22,.59],[.78,.59],[.68,.72],[.32,.72]]},{c:0,p:[[.50,.23],[.50,.59],[.78,.59]]}]},
{name:'КОТЁНОК',speed:116,paths:[{c:1,p:[[.24,.34],[.19,.15],[.39,.27],[.50,.25],[.61,.27],[.81,.15],[.76,.34],[.82,.48],[.75,.64],[.62,.73],[.50,.73],[.38,.73],[.25,.64],[.18,.48]]},{c:0,p:[[.38,.48],[.44,.52],[.50,.48],[.56,.52],[.62,.48],[.50,.73]]}]},
{name:'БАБОЧКА',speed:132,paths:[{c:2,p:[[.50,.25],[.29,.17],[.17,.31],[.30,.48],[.50,.57],[.70,.48],[.83,.31],[.71,.17]]},{c:0,p:[[.50,.25],[.50,.57],[.43,.72],[.50,.66],[.57,.72]]}]}
];
function resize(){const r=game.getBoundingClientRect();W=r.width;H=r.height;D=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0);grain=Array.from({length:Math.floor(W*H/850)},()=>({x:Math.random()*W,y:Math.random()*H,a:Math.random()*.12+.025,r:Math.random()*.8+.25}));}
new ResizeObserver(resize).observe(game);resize();
function xy(p){return{x:p[0]*W,y:p[1]*H};}
function key(p){return Math.round(p[0]*10000)+':'+Math.round(p[1]*10000);}
function buildLevel(){
 const cfg=levels[level];pegs=[];edges=[];spiders=[];particles=[];const map=new Map();
 cfg.paths.forEach((path,pi)=>{
  const route=path.p.map(v=>{const k=key(v);if(!map.has(k)){const q=xy(v);map.set(k,{id:pegs.length,x:q.x,y:q.y,neighbors:[],pulse:0});pegs.push(map.get(k));}return map.get(k);});
  const routeEdges=[];
  for(let i=0;i<route.length-1;i++){const a=route[i],b=route[i+1];let e=edges.find(z=>(z.a===a&&z.b===b)||(z.a===b&&z.b===a));if(!e){e={a,b,color:path.c,drawn:false,failed:false};edges.push(e);a.neighbors.push({node:b,edge:e});b.neighbors.push({node:a,edge:e});}routeEdges.push(e);}
  {const a=route[route.length-1],b=route[0];let e=edges.find(z=>(z.a===a&&z.b===b)||(z.a===b&&z.b===a));if(!e){e={a,b,color:path.c,drawn:false,failed:false};edges.push(e);a.neighbors.push({node:b,edge:e});b.neighbors.push({node:a,edge:e});}routeEdges.push(e);}
  route.forEach((n,i)=>{const next=route[(i+1)%route.length];const ix=n.neighbors.findIndex(v=>v.node===next);if(ix>=0)n.arrow=ix;});
  spiders.push({color:path.c,route,routeEdges,routeIndex:0,progress:0,x:route[0].x,y:route[0].y,from:route[0],to:route[1],t:0,angle:Math.atan2(route[1].y-route[0].y,route[1].x-route[0].x),done:false,broken:false,fall:0});
 });
 hud.style.display='flex';levelLabel.textContent='УРОВЕНЬ '+(level+1)+' · '+cfg.name;localStorage.setItem('silkShapeLevel',String(level));updateProgress();
}
function totalEdges(){return spiders.reduce((n,s)=>n+s.routeEdges.length,0);}
function updateProgress(){const done=spiders.reduce((n,s)=>n+s.progress,0),pct=Math.min(100,Math.floor(done/totalEdges()*100));progressBar.style.width=pct+'%';progressText.textContent=pct+'%';}
function audioInit(){if(!soundOn)return;if(!audio){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audio=new AC();}if(audio?.state==='suspended')audio.resume();}
function tone(f,d,type='sine',v=.035,delay=0){if(!audio||!soundOn)return;const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+d+.02);}
function pluck(c){tone(c===0?440:c===1?520:330,.19,'triangle',.028);tone(c===0?660:780,.14,'sine',.013,.025);}
function snap(){tone(150,.34,'sawtooth',.06);tone(72,.42,'triangle',.045,.035);}
function chord(){[392,494,587,784].forEach((f,i)=>tone(f,.55,'triangle',.03,i*.075));}
function start(){audioInit();level=savedLevel;scene='playing';screen.classList.add('hidden');screen.classList.remove('compact');buildLevel();}
playBtn.addEventListener('click',start);
document.getElementById('restart').addEventListener('click',()=>{if(scene==='playing'||scene==='failed')restart();});
document.getElementById('home').addEventListener('click',home);
document.getElementById('settingsOpen').addEventListener('click',settings);
function home(){clearTimeout(panelTimer);scene='start';hud.style.display='none';showMenu();}
function showMenu(){screen.innerHTML='<div class="card"><div class="eyebrow">Маленькая мастерская чудес</div><h1>SILK <span>&amp; SHAPE</span></h1><p class="subtitle">Пройдено: '+savedLevel+' из 5 · следующий уровень '+(savedLevel+1)+'</p><button class="primary" id="play">ИГРАТЬ</button><button id="settingsOpen" style="margin-top:18px;border:1px solid #d5c7b5;background:#f4efe6;color:#5c4d3c;border-radius:14px;padding:12px 18px;font:700 13px system-ui">⚙ Настройки</button><div class="small">5 уютных узоров · хлопковые нити · живые жучки</div></div>';screen.classList.remove('hidden','compact');document.getElementById('play').onclick=start;document.getElementById('settingsOpen').onclick=settings;}
function settings(){screen.innerHTML='<div class="card"><div class="eyebrow">SILK &amp; SHAPE</div><h1 style="font-size:34px">Настройки</h1><p class="subtitle">Звук: '+(soundOn?'Включён':'Выключен')+'</p><button class="primary" id="soundToggle">ЗВУК: '+(soundOn?'ВКЛ':'ВЫКЛ')+'</button><button id="resetProgress" style="width:100%;margin-top:12px;border:1px solid #d5c7b5;background:#f4efe6;color:#8d4e43;border-radius:14px;padding:13px;font:700 12px system-ui">СБРОСИТЬ ПРОГРЕСС</button><button id="settingsBack" style="margin-top:16px;border:0;background:none;color:#806f5d;font:700 13px system-ui">НАЗАД</button></div>';screen.classList.remove('hidden');screen.classList.add('compact');document.getElementById('soundToggle').onclick=()=>{soundOn=!soundOn;localStorage.setItem('silkShapeSound',soundOn?'on':'off');if(soundOn)audioInit();settings();};document.getElementById('resetProgress').onclick=()=>{if(confirm('Сбросить весь прогресс и начать с первого уровня?')){savedLevel=0;level=0;localStorage.setItem('silkShapeLevel','0');settings();}};document.getElementById('settingsBack').onclick=()=>{showMenu();};}
function restart(){scene='playing';screen.classList.add('hidden');screen.classList.remove('compact');buildLevel();}
function panel(title,sub,button,fn){screen.innerHTML='<div class="card"><div class="eyebrow">SILK &amp; SHAPE · МАСТЕРСКАЯ</div><h1>'+title+'</h1><p class="subtitle">'+sub+'</p><button class="primary" id="panelAction">'+button+'</button></div>';screen.classList.remove('hidden');screen.classList.add('compact');document.getElementById('panelAction').addEventListener('click',fn);}
function fail(s,e){if(scene!=='playing')return;scene='failed';s.broken=true;s.fall=0;if(e)e.failed=true;snap();for(let i=0;i<26;i++){const t=Math.random();particles.push({x:s.from.x+(s.to.x-s.from.x)*t,y:s.from.y+(s.to.y-s.from.y)*t,vx:(Math.random()-.5)*100,vy:(Math.random()-.7)*100,life:1,color:'#C7433E',r:Math.random()*3+1});}clearTimeout(panelTimer);panelTimer=setTimeout(()=>{if(scene==='failed')panel('Нить порвалась!','Жучок свернул не на ту нить. Попробуй сплести узор ещё раз.','ЗАНОВО',restart);},550);}
function win(){if(scene!=='playing')return;scene='won';chord();clearTimeout(panelTimer);panelTimer=setTimeout(()=>{if(scene!=='won')return;if(level<4)panel('Узор готов!','Все жучки добрались до последних точек, а каждая нить на месте.','СЛЕДУЮЩИЙ УЗОР',()=>{level++;savedLevel=level;localStorage.setItem('silkShapeLevel',String(level));scene='playing';screen.classList.add('hidden');screen.classList.remove('compact');buildLevel();});else panel('Мастер нитей!','Пять узоров сотканы. Прекрасная работа!','ИГРАТЬ СНОВА',()=>{level=0;savedLevel=0;localStorage.setItem('silkShapeLevel','0');scene='playing';screen.classList.add('hidden');screen.classList.remove('compact');buildLevel();});},500);}
function tap(x,y){if(scene!=='playing')return;let hit=null,dist=1e9;for(const p of pegs){const d=Math.hypot(x-p.x,y-p.y);if(d<Math.max(31,W*.075)&&d<dist){hit=p;dist=d;}}if(!hit||!hit.neighbors.length)return;hit.arrow=(hit.arrow+1)%hit.neighbors.length;hit.pulse=1;pluck(hit.neighbors[hit.arrow].edge.color);}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();tap(e.clientX-r.left,e.clientY-r.top);});
function update(dt){
 time+=dt;
 for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=150*dt;p.life-=dt*1.65;}particles=particles.filter(p=>p.life>0);
 pegs.forEach(p=>p.pulse=Math.max(0,p.pulse-dt*2.7));
 if(scene==='failed'){const s=spiders.find(v=>v.broken);if(s){s.y+=220*dt;s.fall+=dt;}return;}
 if(scene!=='playing')return;
 for(const s of spiders){if(s.done)continue;
  if(s.t===0){const current=s.route[s.routeIndex],choice=current.neighbors[current.arrow];if(!choice)continue;s.from=current;s.to=choice.node;s.edgeChoice=choice;}
  const choice=s.edgeChoice;
  const angle=Math.atan2(s.to.y-s.from.y,s.to.x-s.from.x);let diff=((angle-s.angle+Math.PI*3)%(TAU))-Math.PI;s.angle+=diff*Math.min(1,dt*12);
  s.t+=levels[level].speed*dt/Math.max(1,Math.hypot(s.to.x-s.from.x,s.to.y-s.from.y));
  s.x=s.from.x+(s.to.x-s.from.x)*Math.min(1,s.t);s.y=s.from.y+(s.to.y-s.from.y)*Math.min(1,s.t);
  if(s.t>=1){
   if(choice.edge.color!==s.color){fail(s,choice.edge);return;}
   const nextIndex=s.route.indexOf(s.to),prev=(s.routeIndex-1+s.route.length)%s.route.length;
   if(nextIndex===((s.routeIndex+1)%s.route.length)){s.progress++;choice.edge.drawn=true;}
   else if(nextIndex===prev){s.progress=Math.max(0,s.progress-1);}
   s.routeIndex=nextIndex;s.x=s.to.x;s.y=s.to.y;s.t=0;pluck(s.color);updateProgress();
   if(s.progress>=s.routeEdges.length){s.done=true;s.x=s.to.x;s.y=s.to.y;}
  }
 }
 if(spiders.every(s=>s.done)){progressBar.style.width='100%';progressText.textContent='100%';win();}
}
function roundedLine(a,b,color,width,alpha=1){
 const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;
 ctx.save();ctx.globalAlpha=alpha;ctx.lineCap='round';ctx.lineJoin='round';
 ctx.strokeStyle='rgba(66,48,31,.25)';ctx.lineWidth=width+5;ctx.beginPath();ctx.moveTo(a.x+1.8,a.y+3);ctx.lineTo(b.x+1.8,b.y+3);ctx.stroke();
 ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
 ctx.strokeStyle='rgba(255,246,225,.48)';ctx.lineWidth=Math.max(.8,width*.17);ctx.beginPath();for(let d=5;d<len;d+=7){const w=Math.sin(d*.13)*width*.22,x=a.x+dx*d/len+nx*w,y=a.y+dy*d/len+ny*w;ctx.moveTo(x-nx*1.8,y-ny*1.8);ctx.lineTo(x+nx*1.8,y+ny*1.8);}ctx.stroke();
 ctx.strokeStyle='rgba(92,77,60,.2)';ctx.lineWidth=Math.max(.7,width*.13);ctx.beginPath();for(let d=3;d<len;d+=7){const w=Math.sin(d*.13+Math.PI)*width*.2,x=a.x+dx*d/len+nx*w,y=a.y+dy*d/len+ny*w;ctx.moveTo(x-nx*1.4,y-ny*1.4);ctx.lineTo(x+nx*1.4,y+ny*1.4);}ctx.stroke();ctx.restore();
}
function background(){
 ctx.fillStyle=PAPER;ctx.fillRect(0,0,W,H);
 const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'rgba(255,255,255,.24)');g.addColorStop(1,'rgba(176,146,108,.07)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.save();for(const q of grain){ctx.globalAlpha=q.a;ctx.fillStyle='#9b8366';ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,TAU);ctx.fill();}ctx.restore();
 ctx.save();ctx.strokeStyle='rgba(128,101,72,.07)';ctx.lineWidth=1;ctx.strokeRect(12,12,W-24,H-24);ctx.restore();
}
function drawPeg(p){
 ctx.save();ctx.translate(p.x,p.y);
 ctx.fillStyle='rgba(76,57,37,.17)';ctx.beginPath();ctx.ellipse(1.5,4.5,12,9,0,0,TAU);ctx.fill();
 const wood=ctx.createRadialGradient(-4,-5,1,0,0,15);wood.addColorStop(0,'#F0E5D4');wood.addColorStop(.62,'#D6C7B2');wood.addColorStop(1,'#B39E82');
 ctx.fillStyle=wood;ctx.strokeStyle=INK;ctx.lineWidth=1.7;ctx.beginPath();ctx.arc(0,0,10.5+(p.pulse*2),0,TAU);ctx.fill();ctx.stroke();
 ctx.strokeStyle='rgba(92,77,60,.24)';ctx.lineWidth=.8;ctx.beginPath();ctx.arc(-1,-1,6,Math.PI*1.05,Math.PI*1.8);ctx.stroke();
 if(p.neighbors.some(v=>v.edge.drawn)){ctx.fillStyle='rgba(255,249,235,.85)';ctx.strokeStyle='rgba(92,77,60,.45)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,3.1,0,TAU);ctx.fill();ctx.stroke();}
 const n=p.neighbors[p.arrow];if(n){const a=Math.atan2(n.node.y-p.y,n.node.x-p.x),r=20;ctx.rotate(a);ctx.fillStyle='#5C4D3C';ctx.strokeStyle='#F4EFE6';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(r+7,0);ctx.lineTo(r-3,-6);ctx.lineTo(r-1,-1);ctx.lineTo(r-1,1);ctx.lineTo(r-3,6);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(0,0,17,-.32,.32);ctx.strokeStyle='rgba(92,77,60,.35)';ctx.lineWidth=1.2;ctx.stroke();}
 ctx.restore();
}
function drawBug(s){
 ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.angle);
 const color=C[s.color],phase=time*19;
 // six articulated legs
 ctx.strokeStyle='#594737';ctx.lineWidth=1.7;ctx.lineCap='round';
 for(let i=0;i<3;i++)for(const side of [-1,1]){
  const y=side*(2+i*2.1),kick=Math.sin(phase+i*1.8+(side>0?Math.PI:0))*3.2;
  ctx.beginPath();ctx.moveTo(-2+i*2,y*.35);ctx.lineTo(-5+i*2,y+kick*.45);ctx.lineTo(-8+i*2,y+side*(5+Math.abs(kick)));ctx.stroke();
 }
 // abdomen and shell
 ctx.fillStyle='rgba(75,55,39,.18)';ctx.beginPath();ctx.ellipse(-2,2,8,5.7,0,0,TAU);ctx.fill();
 ctx.fillStyle=color;ctx.strokeStyle='#594737';ctx.lineWidth=1.15;ctx.beginPath();ctx.ellipse(-1,0,8.5,5.6,0,0,TAU);ctx.fill();ctx.stroke();
 ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-7,-1);ctx.quadraticCurveTo(-2,-5,4,-3);ctx.stroke();
 // head, eyes, antennae
 ctx.fillStyle='#594737';ctx.beginPath();ctx.arc(7,0,3.5,0,TAU);ctx.fill();
 ctx.fillStyle='#fff8e9';ctx.beginPath();ctx.arc(8.2,-1.2,.8,0,TAU);ctx.arc(8.2,1.2,.8,0,TAU);ctx.fill();
 ctx.strokeStyle='#594737';ctx.lineWidth=1.1;ctx.beginPath();ctx.moveTo(8,-2);ctx.quadraticCurveTo(11,-7,14,-6);ctx.moveTo(8,2);ctx.quadraticCurveTo(11,7,14,6);ctx.stroke();
 ctx.restore();
}
function draw(){
 background();
 for(const e of edges){
  if(e.failed)roundedLine(e.a,e.b,'#C7433E',7,.98);
  else if(e.drawn)roundedLine(e.a,e.b,C[e.color],5,.98);
  else{ctx.save();ctx.setLineDash([3,7]);ctx.lineDashOffset=-time*5;ctx.strokeStyle=e.failed?'#C7433E':C[e.color];ctx.globalAlpha=.42;ctx.lineWidth=2.4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(e.a.x,e.a.y);ctx.lineTo(e.b.x,e.b.y);ctx.stroke();ctx.restore();}
 }
 pegs.forEach(drawPeg);
 spiders.forEach(s=>{if(scene==='playing'&&s.t>0&&!s.broken)roundedLine(s.from,{x:s.x,y:s.y},C[s.color],5,.98);drawBug(s);});
 if(scene==='start')drawDemo();
 for(const p of particles){ctx.save();ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();ctx.restore();}
}
function demoPaths(){const star=[[.50,.27],[.61,.45],[.82,.45],[.65,.58],[.72,.79],[.50,.66],[.28,.79],[.35,.58],[.18,.45],[.39,.45]],flower=[[.50,.22],[.61,.34],[.76,.31],[.72,.47],[.83,.59],[.66,.65],[.62,.81],[.50,.70],[.38,.81],[.34,.65],[.17,.59],[.28,.47],[.24,.31],[.39,.34]];return demo.cycle%2?[flower,star]:[star,flower];}
function resetDemo(){demo.bugs=demoPaths().map((pts,i)=>({pts,color:i===0?0:1,seg:0,t:0,x:pts[0][0]*W,y:pts[0][1]*H,done:false,angle:0,trail:[]}));demo.fade=0;demo.hold=0;}
function drawDemo(){if(!demo.bugs.length)resetDemo();let all=true;for(const b of demo.bugs){const pts=b.pts,a=pts[b.seg],z=pts[(b.seg+1)%pts.length],ax=a[0]*W,ay=a[1]*H,bx=z[0]*W,by=z[1]*H,len=Math.hypot(bx-ax,by-ay)||1;if(!b.done){all=false;b.t=Math.min(1,b.t+dtDemo*75/len);b.x=ax+(bx-ax)*b.t;b.y=ay+(by-ay)*b.t;b.angle=Math.atan2(by-ay,bx-ax);if(b.t>=1){b.trail.push({a:{x:ax,y:ay},b:{x:bx,y:by}});b.seg++;b.t=0;if(b.seg>=pts.length)b.done=true;}}ctx.save();ctx.globalAlpha=1-demo.fade;for(const line of b.trail)roundedLine(line.a,line.b,C[b.color],4,.9);if(!b.done)roundedLine({x:ax,y:ay},{x:b.x,y:b.y},C[b.color],4,.9);drawBug(b);ctx.restore();}if(all){demo.hold+=dtDemo;if(demo.hold>1.1)demo.fade=Math.min(1,demo.fade+dtDemo*.48);}if(demo.fade>=1){demo.cycle++;resetDemo();}}
const baseUpdate=update;update=function(dt){dtDemo=dt;baseUpdate(dt);if(scene==='start'&&!demo.bugs.length)resetDemo();};
function frame(ts){const dt=Math.min(.04,(ts-last)/1000||0);last=ts;update(dt);draw();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();</script>
