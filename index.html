<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080d18">
<title>Silk &amp; Shape — Жуки-Ткачи</title>
<style>
:root{color-scheme:dark;--bg:#080d18;--panel:rgba(13,22,39,.82);--text:#eaf4ff;--muted:#91a5c2;--mint:#65f5d0;--pink:#ff70c7}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);touch-action:none}
body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 38%,#15233a 0,#0b1322 46%,#060a12 100%)}
#game{position:relative;width:min(100vw,56.25vh);height:min(100dvh,177.7778vw);aspect-ratio:9/16;overflow:hidden;background:linear-gradient(180deg,rgba(8,15,28,.4),rgba(5,10,19,.82));isolation:isolate}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;z-index:2;top:max(15px,env(safe-area-inset-top));left:16px;right:16px;display:none;align-items:center;gap:12px}
.pill{background:rgba(10,19,34,.72);border:1px solid rgba(158,194,232,.16);backdrop-filter:blur(14px);border-radius:16px;padding:9px 12px;box-shadow:0 8px 30px #0003}
#levelLabel{font-size:12px;letter-spacing:.14em;color:#9eb4d2;text-transform:uppercase;white-space:nowrap}
#progressWrap{height:5px;background:#ffffff18;border-radius:10px;margin-top:6px;overflow:hidden;width:100%}
#progress{height:100%;width:0;background:linear-gradient(90deg,#63f4cf,#81aaff);border-radius:10px;transition:width .2s}
#progressText{font-size:12px;font-weight:700;min-width:36px;text-align:right}
#restart{margin-left:auto;width:42px;height:42px;border-radius:14px;border:1px solid #ffffff24;color:#eaf4ff;background:#101d31;font-size:20px}
#screen{position:absolute;z-index:3;inset:0;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center;background:linear-gradient(180deg,rgba(5,10,19,.08),rgba(5,10,19,.34))}
.card{width:100%;max-width:350px;padding:30px 22px;border:1px solid rgba(170,207,255,.18);border-radius:28px;background:linear-gradient(145deg,rgba(17,31,51,.83),rgba(8,16,29,.78));box-shadow:0 24px 90px #0008, inset 0 1px #ffffff12;backdrop-filter:blur(18px)}
.eyebrow{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#83e8d2;margin-bottom:14px}
h1{font-size:clamp(36px,10vw,54px);line-height:.98;letter-spacing:-.055em;margin:0 0 16px;font-weight:900;color:#f2fbff;text-shadow:0 0 12px #6cf6dc99,0 0 34px #5db5ff66}
h1 span{display:block;color:#8bf4df}
.subtitle{font-size:14px;line-height:1.55;color:#b2c4dc;margin:0 auto 26px;max-width:280px}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.primary{width:100%;border:0;border-radius:18px;padding:16px 20px;font-size:16px;font-weight:850;letter-spacing:.08em;color:#06151c;background:linear-gradient(110deg,#78f6d7,#8dc5ff);box-shadow:0 0 24px #67e9d766,0 8px 25px #0005;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.035);box-shadow:0 0 38px #67e9d799,0 8px 25px #0005}}
.small{font-size:12px;color:#8298b6;margin-top:16px}
#screen.hidden{display:none}
#screen.compact{background:rgba(3,7,14,.38)}
#screen.compact .card{max-width:300px;padding:25px 20px}
#screen.compact h1{font-size:32px;margin-bottom:10px}
#screen.compact .subtitle{margin-bottom:18px}
@media(min-height:700px){.card{padding:38px 26px}}
</style>
</head>
<body>
<main id="game" aria-label="Silk and Shape game">
<canvas id="canvas"></canvas>
<div id="hud"><div class="pill" style="flex:1"><div id="levelLabel">УРОВЕНЬ 1</div><div id="progressWrap"><div id="progress"></div></div></div><div id="progressText">0%</div><button id="restart" aria-label="Перезапустить уровень">↻</button></div>
<section id="screen"><div class="card"><div class="eyebrow">A tiny world of living geometry</div><h1>SILK <span>&amp; SHAPE</span></h1><p class="subtitle">Нажимай на точки, чтобы направить жучков по узору</p><button class="primary" id="play">ИГРАТЬ</button><div class="small">4 узора · 2 цвета · бесконечность нитей</div></div></section>
</main>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),game=document.getElementById('game');
const hud=document.getElementById('hud'),screen=document.getElementById('screen'),playBtn=document.getElementById('play');
const levelLabel=document.getElementById('levelLabel'),progressBar=document.getElementById('progress'),progressText=document.getElementById('progressText');
const TAU=Math.PI*2, COLORS=['#65f5d0','#ff78c9'];
let W=0,H=0,dpr=1,scene='start',level=0,last=0,time=0,audio=null,spiders=[],pegs=[],edges=[],particles=[],ambient=[],shake=0,failTimer=0,winTimer=0,transitionTimer=0;
const palettes=[['#65f5d0'],['#ff78c9'],['#65f5d0','#ff78c9'],['#65f5d0','#ff78c9']];
const configs=[
{speed:1.05,paths:[{c:0,pts:[[.5,.27],[.76,.5],[.5,.73],[.24,.5]]}]},
{speed:1.55,paths:[{c:0,pts:[[.5,.2],[.676,.742],[.22,.408],[.78,.408],[.324,.742]]}]},
{speed:1.9,paths:[{c:0,pts:[[.5,.19],[.79,.5],[.5,.81],[.21,.5]]},{c:1,pts:[[.5,.35],[.66,.5],[.5,.65],[.34,.5]]}]},
{speed:2.5,paths:[{c:0,pts:[[.5,.14],[.75,.31],[.83,.59],[.5,.82],[.17,.59],[.25,.31]]},{c:1,pts:[[.5,.27],[.68,.42],[.68,.62],[.5,.75],[.32,.62],[.32,.42]]}]}
];
function resize(){const r=game.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ambient=Array.from({length:55},(_,i)=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.35,p:Math.random()*TAU,s:Math.random()*.22+.05}));}
new ResizeObserver(resize).observe(game);resize();
function point(p){return{x:p[0]*W,y:p[1]*H};}
function buildLevel(){const cfg=configs[level];pegs=[];edges=[];spiders=[];particles=[];let id=0;
 cfg.paths.forEach((path,pi)=>{const nodes=path.pts.map((xy,i)=>{const p=point(xy),node={id:id++,x:p.x,y:p.y,neighbors:[],arrow:0,color:path.c,path:pi,index:i};pegs.push(node);return node;});
 nodes.forEach((n,i)=>{const prev=nodes[(i-1+nodes.length)%nodes.length],next=nodes[(i+1)%nodes.length];n.neighbors=[prev,next];n.arrow=0;const e={a:n,b:next,color:path.c,path:pi,index:i,drawn:false};edges.push(e);n.forward=next;n.back=prev;});
 spiders.push({path:pi,color:path.c,nodes,index:0,x:nodes[0].x,y:nodes[0].y,from:nodes[0],to:nodes[1],t:0,wait:0,done:false,fall:0,broken:false});
 });
 hud.style.display='flex';levelLabel.textContent='УРОВЕНЬ '+(level+1);updateProgress();
}
function updateProgress(){const total=spiders.reduce((s,a)=>s+a.nodes.length-1,0),done=spiders.reduce((s,a)=>s+a.index,0);const pct=Math.min(100,Math.round(done/total*100));progressBar.style.width=pct+'%';progressText.textContent=pct+'%';}
function audioInit(){if(!audio){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audio=new AC();}if(audio&&audio.state==='suspended')audio.resume();}
function tone(freq,duration,type='sine',volume=.045,delay=0){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime+delay);g.gain.setValueAtTime(.0001,audio.currentTime+delay);g.gain.exponentialRampToValueAtTime(volume,audio.currentTime+delay+.012);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+delay+duration);o.connect(g);g.connect(audio.destination);o.start(audio.currentTime+delay);o.stop(audio.currentTime+delay+duration+.03);}
function pluck(c=0){tone(c?660:520,.24,'triangle',.035);tone(c?990:780,.18,'sine',.018,.025);}
function snap(){tone(180,.38,'sawtooth',.075);tone(82,.5,'triangle',.06,.04);}
function chord(){[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,.65,'sine',.035,i*.09));}
function startGame(){audioInit();level=0;scene='playing';screen.classList.add('hidden');screen.classList.remove('compact');buildLevel();}
playBtn.addEventListener('click',startGame);
document.getElementById('restart').addEventListener('click',()=>{if(scene==='playing'||scene==='failed')restartLevel();});
function restartLevel(){scene='playing';screen.classList.add('hidden');screen.classList.remove('compact');buildLevel();}
function showPanel(title,sub,button,action){screen.classList.remove('hidden');screen.classList.add('compact');screen.innerHTML='<div class="card"><div class="eyebrow">SILK &amp; SHAPE</div><h1>'+title+'</h1><p class="subtitle">'+sub+'</p><button class="primary" id="panelAction">'+button+'</button></div>';document.getElementById('panelAction').addEventListener('click',action);}
function fail(s,edge){if(scene!=='playing')return;scene='failed';snap();shake=12;s.broken=true;const a=s.from,b=s.to;for(let i=0;i<24;i++){const t=Math.random();particles.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,vx:(Math.random()-.5)*5,vy:(Math.random()-.7)*5,life:1,color:'#ff4d68',r:Math.random()*3+1});}if(edge){edge.failed=true;}s.fall=0;failTimer=0;setTimeout(()=>{if(scene==='failed')showPanel('Нить порвалась!','Жучок сбился с узора. Попробуй ещё раз.','ЗАНОВО',restartLevel);},520);}
function win(){if(scene!=='playing')return;scene='won';chord();setTimeout(()=>{if(scene!=='won')return;if(level<3){showPanel('Узор готов!','Нити сплелись в единую форму. Следующий узор сложнее.','ДАЛЬШЕ',()=>{level++;scene='playing';screen.classList.add('hidden');screen.classList.remove('compact');buildLevel();});}else{showPanel('Великолепно!','Все четыре узора сотканы. Ты — настоящий мастер шелка.','СНАЧАЛА',()=>{level=0;scene='playing';screen.classList.add('hidden');screen.classList.remove('compact');buildLevel();});}},650);}
function hitTest(x,y){if(scene!=='playing')return;let best=null,dist=1e9;for(const p of pegs){const d=Math.hypot(x-p.x,y-p.y);if(d<Math.max(29,W*.052)&&d<dist){best=p;dist=d;}}if(!best)return;
 const spider=spiders.find(s=>s.path===best.path);if(!spider||spider.done)return;
 best.arrow=(best.arrow+1)%best.neighbors.length;pluck(best.color);best.pulse=1;
}
function pointer(e){const r=canvas.getBoundingClientRect();hitTest(e.clientX-r.left,e.clientY-r.top);}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();pointer(e);});
function update(dt){time+=dt;for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.life-=dt*1.4;}particles=particles.filter(p=>p.life>0);
 for(const p of pegs) p.pulse=Math.max(0,(p.pulse||0)-dt*2.4);
 if(scene!=='playing')return;
 for(const s of spiders){if(s.done)continue;if(s.fall){s.y+=s.fall*dt*180;s.fall+=dt*2;continue;}
 if(s.wait>0){s.wait-=dt;continue;}
 const node=s.nodes[s.index];const next=node.neighbors[node.arrow];const correct=node.forward;
 if(next!==correct){const bad=edges.find(e=>e.a===node&&e.b===next)||{a:node,b:next};fail(s,bad);return;}
 const edge=edges.find(e=>e.a===node&&e.b===correct);if(!edge||edge.color!==s.color){fail(s,edge);return;}
 s.from=node;s.to=correct;s.t+=dt*configs[level].speed*1.25;
 if(s.t>=1){s.t=0;s.index++;edge.drawn=true;pluck(s.color);s.x=s.to.x;s.y=s.to.y;s.wait=.08;updateProgress();if(s.index>=s.nodes.length-1){s.done=true;}}
 else{s.x=s.from.x+(s.to.x-s.from.x)*s.t;s.y=s.from.y+(s.to.y-s.from.y)*s.t;}
 }
 if(spiders.every(s=>s.done))win();
}
function glowLine(a,b,color,width,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.shadowColor=color;ctx.shadowBlur=16;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.restore();}
function drawBackground(){ctx.clearRect(0,0,W,H);const g=ctx.createRadialGradient(W*.5,H*.45,0,W*.5,H*.45,W*.72);g.addColorStop(0,'#172943');g.addColorStop(.55,'#0b1628');g.addColorStop(1,'#070c16');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.save();for(const p of ambient){const a=.16+.22*(.5+.5*Math.sin(time*p.s+p.p));ctx.globalAlpha=a;ctx.fillStyle='#a8d8ff';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();}ctx.restore();
 for(let y=0;y<H;y+=42){ctx.strokeStyle='rgba(130,170,220,.025)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
}
function draw(){drawBackground();
 if(pegs.length){for(const e of edges){const a=e.a,b=e.b;ctx.save();ctx.setLineDash([5,9]);ctx.lineDashOffset=-time*8;ctx.strokeStyle=e.failed?'#ff405d':palettes[level][e.color];ctx.globalAlpha=e.failed?.9:.19;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.restore();if(e.drawn)glowLine(a,b,palettes[level][e.color],2.8,.95);}
 for(const p of pegs){const color=palettes[level][p.color];ctx.save();ctx.translate(p.x,p.y);ctx.globalAlpha=.12;ctx.fillStyle=color;ctx.beginPath();ctx.arc(0,0,25+(p.pulse||0)*8,0,TAU);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#111e31';ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.shadowColor=color;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(0,0,7+(p.pulse||0)*2,0,TAU);ctx.fill();ctx.stroke();const target=p.neighbors[p.arrow];const ang=Math.atan2(target.y-p.y,target.x-p.x);ctx.rotate(ang);ctx.fillStyle=color;ctx.shadowBlur=10;ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(6,-4);ctx.lineTo(6,4);ctx.closePath();ctx.fill();ctx.restore();}
 for(const s of spiders){if(s.fall){drawBug(s.x,s.y,s.color);continue;}if(s.done){drawBug(s.nodes[s.nodes.length-1].x,s.nodes[s.nodes.length-1].y,s.color);continue;}drawBug(s.x,s.y,s.color);}
 }
 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();}ctx.globalAlpha=1;
 if(scene==='failed'&&spiders.length){const s=spiders.find(x=>x.broken);if(s){s.fall=(s.fall||0)+.06;}}
}
function drawBug(x,y,color){ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(time*8+x*.02)*.12);ctx.shadowColor=palettes[level]?.[color]||'#65f5d0';ctx.shadowBlur=16;ctx.fillStyle=palettes[level]?.[color]||'#65f5d0';for(let i=0;i<3;i++){const side=i%2?1:-1;ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-2,0);ctx.quadraticCurveTo(-9,side*(7+i*3),-12,side*(10+i*4));ctx.stroke();}ctx.beginPath();ctx.ellipse(0,0,6,4.2,0,0,TAU);ctx.fill();ctx.beginPath();ctx.arc(5,0,3,0,TAU);ctx.fill();ctx.restore();}
function loop(ts){const dt=Math.min(.035,(ts-last)/1000||0);last=ts;update(dt);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
